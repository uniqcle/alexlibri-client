# docker-compose.yml
# Запуск:  docker compose up -d
# Остановка: docker compose down (данные остаются в ./postgres-data и ./backups)

services:

  # ─────────────────────────────────────────────────────────────
  # СЕРВИС БД
  # Ключ "postgres-test" — это имя СЕРВИСА в compose.
  # Именно его указываем в `docker compose exec postgres-test ...`
  # и в depends_on у сервиса backup.
  # Не путать с container_name (см. ниже) — это имя КОНТЕЙНЕРА.
  # ─────────────────────────────────────────────────────────────
  postgres-alexlibri:
    image: postgres:16-alpine          # образ: PG 16, лёгкий alpine
    container_name: postgres_alexlibri_db        # имя контейнера в `docker ps`
    restart: unless-stopped            # поднимать после падения/перезагрузки хоста
    environment:
      POSTGRES_USER: ${POSTGRES_USER}          # берётся из .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # берётся из .env
      POSTGRES_DB: ${POSTGRES_DB}              # БД создаётся при первой инициализации
    ports:
      # "<порт на хосте>:<порт в контейнере>"
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Данные БД лежат РЯДОМ с docker-compose.yml (bind-mount).
      # ВАЖНО: каталог должен быть доступен контейнеру (uid 999 внутри alpine).
      - ../postgres/postgres-data:/var/lib/postgresql/data
      # Общий каталог с бэкапами — его же монтирует сервис backup,
      # поэтому файлы, созданные внутри контейнера, видны на хосте.
      - ../postgres/backups:/backups
    healthcheck:
      # Проверка готовности БД: pg_isready отвечает «принимаю подключения».
      # Именно на этот healthy ждёт backup через depends_on.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s    # как часто проверять
      timeout: 5s      # сколько ждать ответа
      retries: 5       # сколько подряд неудач — и контейнер считается unhealthy

  # ─────────────────────────────────────────────────────────────
  # СЕРВИС АВТОБЭКАПА
  # Отдельный контейнер с тем же образом postgres (там есть pg_dump/gzip/find).
  # Работает в фоне: спит BACKUP_INTERVAL секунд → делает дамп → чистит старое.
  # ─────────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: postgres_backup
    restart: unless-stopped
    depends_on:
      # Не стартовать, пока БД не станет healthy (иначе pg_dump упадёт)
      postgres-alexlibri:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}   # пароль для pg_dump (без интерактива)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # ХОСТ, к которому подключается pg_dump.
      # Должен совпадать с ИМЕНЕМ СЕРВИСА БД ("postgres-test"),
      # а не с container_name. Внутри compose-сети DNS работает по имени сервиса.
      POSTGRES_HOST: postgres-alexlibri
      BACKUP_INTERVAL: 86400   # пауза между бэкапами, сек (= 1 сутки)
      BACKUP_KEEP_DAYS: 7      # сколько дней хранить файлы (старше — удаляются)
    volumes:
      # Тот же каталог, что у БД, — сюда пишутся .sql.gz
      - ../postgres/backups:/backups
    # Переопределяем entrypoint, чтобы выполнить наш shell-скрипт,
    # а не стандартный docker-entrypoint.sh postgres (который запустил бы сервер).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # ── Лог старта ──
        echo "Backup service started. Interval: $${BACKUP_INTERVAL}s, keep: $${BACKUP_KEEP_DAYS}d";

        # ── Бесконечный цикл бэкапов ──
        while true; do
          
          # 1) Формируем имя файла: <db>_<YYYYmmdd_HHMMSS>.sql.gz
          TS=$$(date +%Y%m%d_%H%M%S);
          FILE="/backups/$${POSTGRES_DB}_$${TS}.sql.gz";
          echo "[$$(date)] Creating backup: $$FILE";

          # 2) Делаем дамп и сжимаем на лету.
          #    Если pg_dump упал (нет связи, неверные креды) — gzip всё равно
          #    создаст пустой файл, поэтому проверяем код возврата пайпа
          #    и при ошибке удаляем «битый» файл.
          if pg_dump -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" | gzip > "$$FILE"; then
            echo "[$$(date)] Backup OK: $$FILE";
          else
            echo "[$$(date)] Backup FAILED";
            rm -f "$$FILE";
          fi;

          # 3) Ротация: удаляем .sql.gz старше BACKUP_KEEP_DAYS дней.
          #    -mtime +N = «изменён более N*24 часов назад»
          find /backups -name "*.sql.gz" -type f -mtime +$${BACKUP_KEEP_DAYS} -delete;

          # 4) Пауза до следующего бэкапа.
          #    ВНИМАНИЕ: sleep здесь ДУБЛИРУЕТСЯ (см. п.1 в начале цикла).
          #    Фактически интервал между бэкапами = 2 * BACKUP_INTERVAL.
          #    Если нужен ровно один интервал — уберите один из двух sleep.
          sleep "$${BACKUP_INTERVAL}";
        done